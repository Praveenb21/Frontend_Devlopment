<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q10 - Registration Form Validation</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .invalid-field { border: 2px solid #f44336 !important; }
        .error-message { color: #f44336; font-size: 0.9em; margin-top: 5px; display: none; }
        .success-message { 
            padding: 15px; 
            background-color: #e8f5e9; 
            color: #4caf50; 
            border: 1px solid #4caf50; 
            border-radius: 4px; 
            margin-top: 20px; 
            font-weight: bold; 
            display: none;
        }
        button { padding: 10px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>User Registration</h1>
    </header>

    <main>
        <form id="registration-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name">
                <span class="error-message" id="name-error">Name cannot be empty.</span>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter a valid email address">
                <span class="error-message" id="email-error">Please enter a valid email.</span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Min 8 characters">
                <span class="error-message" id="password-error">Password must be at least 8 characters long.</span>
            </div>

            <div class="form-group">
                <button type="submit" id="register-btn">Register</button>
            </div>
        </form>
        
        <div id="success-message" class="success-message">Registration successful! Redirecting...</div>
    </main>

    <script src="q10_form.js"></script>
</body>
</html>
